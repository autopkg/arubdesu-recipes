repos:
  - repo: https://github.com/homebysix/pre-commit-macadmin
    rev: v1.25.1
    hooks:
      - id: check-autopkg-recipes
        args:
          [
            "--recipe-prefix",
            "com.github.autopkg.arubdesu-recipes.",
            "com.github.arubdesu.",
          ]
      - id: forbid-autopkg-overrides
      - id: forbid-autopkg-trust-info
      - id: check-plists
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=100"]
      - id: check-ast
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: local
    hooks:
      # AutoPkg loads a processor by file path and never puts its directory on sys.path, so a
      # shared processor cannot import a sibling. Duplication is the only portable way to share
      # a helper here, which makes silent drift the risk - PRERELEASE_MARKER decides whether a
      # tag is a stable release, and one drifted copy reports a behind pin as current.
      - id: check-duplicated-constants
        name: shared processor constants agree
        entry: python scripts/check_duplicated_constants.py
        language: python
        pass_filenames: false
        files: ^SharedProcessors/.*\.py$
